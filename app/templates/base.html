<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Project{% endblock %}</title>
<style>
  :root { --bg: #ffffff; --fg: #1d1f23; --muted: #5f6672; --line: #e3e5e8; --soft: #f4f5f7;
          --accent: #2754c5; --agent: #eef3ff; --outside: #fff6e6; --error: #b42318; --ok: #1a7f37;
          --user: #2754c5; --user-fg: #ffffff; --card: #ffffff; --shadow: 0 1px 3px rgba(16,24,40,.08); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --fg: #e6e8eb; --muted: #9aa1ab; --line: #30343b; --soft: #1f2227;
            --accent: #8fb0ff; --agent: #1e2a44; --outside: #3a2f1c; --error: #ff8a80; --ok: #6fdd8b;
            --user: #3b5fc9; --user-fg: #ffffff; --card: #1c1f24; --shadow: none; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  nav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 8px 16px;
        border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 5; }
  nav .brand { font-weight: 700; color: var(--fg); margin-right: 14px; text-decoration: none; }
  nav .brand span { color: var(--accent); }
  nav a { color: var(--muted); text-decoration: none; padding: 5px 10px; border-radius: 8px; }
  nav a:hover { background: var(--soft); color: var(--fg); }
  nav a.here { color: var(--fg); font-weight: 600; background: var(--soft); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 12px; }
  h2 { font-size: 1.1rem; margin: 22px 0 8px; }
  a { color: var(--accent); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .scroll { overflow-x: auto; }
  .muted { color: var(--muted); }
  .notice { padding: 10px 12px; background: var(--soft); border-left: 3px solid var(--accent); margin: 12px 0; }
  .error { color: var(--error); }
  textarea, input[type=text] { width: 100%; padding: 8px; font: inherit; color: var(--fg);
                               background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  button { padding: 7px 14px; font: inherit; border-radius: 8px; border: 1px solid var(--line);
           background: var(--soft); color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .line { padding: 8px 10px; margin: 6px 0; border-radius: 6px; background: var(--soft); white-space: pre-wrap; }
  .line.reply { background: var(--agent); }
  .line.outside { background: var(--outside); }
  .line.error { border-left: 3px solid var(--error); }
  .who { font-size: 12px; color: var(--muted); }
  code, pre { font-family: ui-monospace, monospace; font-size: 13px; }
  pre { background: var(--soft); padding: 10px; overflow-x: auto; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); gap: 24px; }
  @media (max-width: 720px) { .split { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<nav>
  <a href="/console" class="brand">Sales <span>Analyst</span></a>
  <a href="/console" class="{{ 'here' if page == 'console' }}">Chat</a>
  <a href="/" class="{{ 'here' if page == 'home' }}">Requests</a>
  <a href="/query" class="{{ 'here' if page == 'query' }}">Explore data</a>
  <a href="/queue" class="{{ 'here' if page == 'queue' }}">Queue</a>
  <a href="/threads" class="{{ 'here' if page == 'threads' }}">Threads</a>
  <a href="/approvals" class="{{ 'here' if page == 'approvals' }}">Approvals</a>
  <a href="/traces" class="{{ 'here' if page in ('traces', 'trace') }}">Traces</a>
</nav>
{% block main %}<main>
{% block content %}{% endblock %}
</main>{% endblock %}
</body>
</html>
