# The project's settings.
#
# YOUR MODEL. Change only the provider, model, base_url and api_key_env lines, and
# effort below for a reasoning model.
# Any vendor's model with tool calling works. Hold it fixed through every
# experiment: an arm that changes the model changes two things at once. The model
# is named here and in pricing.yaml, nowhere else.
#
#   Claude, through Anthropic's API:
#     provider: anthropic
#     model: <a Claude model name>
#     api_key_env: null              # null reads ANTHROPIC_API_KEY
#
#   Anything with an OpenAI-compatible API (OpenAI, Google Gemini, Mistral,
#   DeepSeek, Groq, OpenRouter, a local Ollama or vLLM server, ...):
#     provider: openai-compatible
#     model: <the model name your provider uses>
#     base_url: <your provider's endpoint; null for OpenAI itself>
#     api_key_env: <the environment variable that holds your key; null reads OPENAI_API_KEY>
#
# Then add your model's price line to pricing.yaml and run `make ping`.

provider: null
model: null
base_url: null
api_key_env: null

# Output cap for one model response. Lower it if your model's limit is smaller.
max_tokens: 8000

# Anthropic only. Thinking effort: null leaves the API default; otherwise low |
# medium | high | xhigh | max. Set it, with your reason, rather than asking the model to
# think step by step. Held fixed across every arm you compare.
effort: null

# Anthropic only. "default" lets the API re-run a declined request on the model
# Anthropic recommends for that refusal category; null turns it off. The model
# that actually served each call is recorded and priced.
fallbacks: null

# Hard ceiling, enforced by the harness outside your code, for one run.py run or
# one console session. Your loop's own token budget must sit below it.
session_token_ceiling: 400000

# How many runs run.py runs at once by default. --jobs overrides it, and it only
# applies when sandbox/seed.py says PARALLEL_SAFE = True.
jobs: 1
