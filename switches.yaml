# Each switch has a setting and the values it may take. Your agent reads it with
# harness.runtime.switch("name"); run.py --set name=value sets it for one arm.
# A group, a name with switches under it and no setting, takes the place of the
# flat switch of its name:
#
#   plan:
#     refunds: {setting: "on", values: ["off", "on"]}     # plan.refunds
#
# added: <date> goes on a switch, never on a group. Quote "off" and "on": YAML
# reads them bare as false and true. The README's "Your switches" says more.

# DRAFT: the use cases and their paths are the team's first argument by the four gates (M1.md).
# A use case lists only the paths built; add the other when a pass builds it.
control:
  standard_report: {setting: workflow, values: [workflow], about: "Clean known-format file to the standard quarterly report. Gate 1 fails (steps known in advance)."}
  messy_file: {setting: agent, values: [agent], about: "Unknown or messy file layout. Gate 1 passes (next step depends on what the parse found)."}
  compare_check: {setting: agent, values: [agent], about: "Operator asks to check a table against last quarter's."}
  status_question: {setting: workflow, values: [workflow], about: "A question about work already done, answered from records."}
  out_of_scope: {setting: workflow, values: [workflow], about: "Asks for other distributors' or margin data; declined by rule."}
  batch_reports: {setting: agent, values: [agent], about: "Operator asks for several distributors' reports in one request."}

plan:
  batch_reports: {setting: "on", values: ["off", "on"], about: "Plan helps where the operator's request fixes the steps once read. Lecture 2."}

# Milestone 2 (setup, Nov 20). Each switch carries added: so the Milestone 1 runs, made before it, stay valid.
# Provisional settings: each owner sets the final one from the decision table (PLAN_M2.md section 3.5).
notes:   # abraham: one per kind of session that needs notes; replaces the starter's flat switch
  console: {setting: "on", values: ["off", "on"], added: 2026-11-20, about: "Structured status and IDs for long console sessions; short one-run calls leave notes off."}
  task: {setting: "off", values: ["off", "on"], added: 2026-11-20, about: "Short single-case runs use their current request and bounded tool results."}

context_budget: {setting: 16000, added: 2026-11-20, about: "Most input tokens one call may carry (chars / 4, tool definitions included). abraham, B3."}
compaction_threshold: {setting: 12000, added: 2026-11-20, about: "Past this, older turns are compacted; at most the budget less what every call carries. abraham, B3."}

memory:  # claudea: one per kind of fact kept
  preferences: {setting: "on", values: ["off", "on"], added: 2026-11-20, about: "Kept: a preference the operator states (such as a report email subject prefix). Stated, not inferable from any record. claudea, C6."}
  standing_rules: {setting: "on", values: ["off", "on"], added: 2026-11-20, about: "Kept: a standing rule the operator states (from now on / always / never). Stated, not inferable. claudea, C6."}

tools:   # myron
  loading: {setting: all, values: [all, deferred], added: 2026-11-20, about: "all: 8 definitions a request (9 with run_program), under Lecture 3 slide 24's ~10; deferred is built and tested for a pass. myron, M3."}

code_calls:  # myron: one per use case it is built for
  batch_reports: {setting: "off", values: ["off", "on"], added: 2026-11-20, about: "Closest use case to looping over many results, but each request's registry reads one distributor in a few calls: off until a run shows the loop. myron, M3."}

approval:  # myron: one per use case with a plan
  batch_reports: {setting: per_action, values: [per_action, plan], added: 2026-11-20, about: "per_action: the plan cannot fix a send's pending_id or text, known only after each draft passes the critique (Lecture 5, slide 18). myron, M6."}

critique:
  report_email: {setting: external, values: ["off", "external"], about: "Recompute figures, period and recipient from the sandbox before a draft email is written. Lecture 2."}

# Tool-surface treatments. Examples are embedded in descriptions because the Chat
# Completions function format has no separate examples field. Strict controls the
# function's strict flag; the registry validates every call regardless of this flag.
examples:
  parse_file: {setting: "on", values: ["off", "on"], about: "Show the bounded parse result shape for an unfamiliar upload."}
  query_sales: {setting: "on", values: ["off", "on"], about: "Show valid quarter calls for the request-scoped sales read."}
  render_chart: {setting: "off", values: ["off", "on"], about: "The schema is concrete enough without an example."}
  save_report: {setting: "off", values: ["off", "on"], about: "Avoid spending definition tokens on a plain versioned write."}
  draft_report_email: {setting: "off", values: ["off", "on"], about: "The critique, not a schema example, checks email facts."}
  draft_clarifying_question: {setting: "off", values: ["off", "on"], about: "A short subject/body contract needs no example."}

strict:
  parse_file: {setting: "off", values: ["off", "on"], about: "Delimiter and decimal are optional; keep the shared non-strict input contract."}
  query_sales: {setting: "on", values: ["off", "on"], about: "Constrain the required quarter string in a closed object."}
  render_chart: {setting: "off", values: ["off", "on"], about: "Labels and values are locally checked for matching lengths and valid values."}
  save_report: {setting: "off", values: ["off", "on"], about: "The program normally chooses this write and the registry validates it."}
  draft_report_email: {setting: "off", values: ["off", "on"], about: "External critique supplies the important factual boundary."}
  draft_clarifying_question: {setting: "off", values: ["off", "on"], about: "A plain bounded pending-record write."}
  ask_stranger: {setting: "on", values: ["off", "on"], added: 2026-11-20, about: "One required string in a closed object: strict-compatible, and the send must not carry stray fields. myron, M2."}
  send_report_email: {setting: "on", values: ["off", "on"], added: 2026-11-20, about: "One required integer pending_id: an irreversible call gets the vendor's grammar too. myron, M2."}
  search_tools: {setting: "on", values: ["off", "on"], added: 2026-11-20, about: "One required query string in a closed object. myron, M3."}
  run_program: {setting: "on", values: ["off", "on"], added: 2026-11-20, about: "One required code string; the registry caps its length. myron, M3."}
