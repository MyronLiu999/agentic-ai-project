# Each switch has a setting and the values it may take. Your agent reads it with
# harness.runtime.switch("name"); run.py --set name=value sets it for one arm.
# A group, a name with switches under it and no setting, takes the place of the
# flat switch of its name:
#
#   plan:
#     refunds: {setting: "on", values: ["off", "on"]}     # plan.refunds
#
# added: <date> goes on a switch, never on a group. Quote "off" and "on": YAML
# reads them bare as false and true. The README's "Your switches" says more.

# DRAFT: the use cases and their paths are the team's first argument by the four gates (M1.md).
# A use case lists only the paths built; add the other when a pass builds it.
control:
  standard_report: {setting: workflow, values: [workflow], about: "Clean known-format file to the standard quarterly report. Gate 1 fails (steps known in advance)."}
  messy_file: {setting: agent, values: [agent], about: "Unknown or messy file layout. Gate 1 passes (next step depends on what the parse found)."}
  compare_check: {setting: agent, values: [agent], about: "Operator asks to check a table against last quarter's."}
  status_question: {setting: workflow, values: [workflow], about: "A question about work already done, answered from records."}
  out_of_scope: {setting: workflow, values: [workflow], about: "Asks for other distributors' or margin data; declined by rule."}
  batch_reports: {setting: agent, values: [agent], about: "Operator asks for several distributors' reports in one request."}

plan:
  batch_reports: {setting: "on", values: ["off", "on"], about: "Plan helps where the operator's request fixes the steps once read. Lecture 2."}

notes:
  setting: "off"
  values: ["off", "on"]
  about: Milestone 2. Stays off.

critique:
  report_email: {setting: external, values: ["off", "external"], about: "Recompute figures, period and recipient from the sandbox before a draft email is written. Lecture 2."}

# Tool-surface treatments. Examples are embedded in descriptions because the Chat
# Completions function format has no separate examples field. Strict controls the
# function's strict flag; the registry validates every call regardless of this flag.
examples:
  parse_file: {setting: "on", values: ["off", "on"], about: "Show the bounded parse result shape for an unfamiliar upload."}
  query_sales: {setting: "on", values: ["off", "on"], about: "Show valid quarter and metric calls for the most-used read."}
  render_chart: {setting: "off", values: ["off", "on"], about: "The schema is concrete enough without an example."}
  save_report: {setting: "off", values: ["off", "on"], about: "Avoid spending definition tokens on a plain versioned write."}
  draft_report_email: {setting: "off", values: ["off", "on"], about: "The critique, not a schema example, checks email facts."}
  draft_clarifying_question: {setting: "off", values: ["off", "on"], about: "A short subject/body contract needs no example."}

strict:
  parse_file: {setting: "off", values: ["off", "on"], about: "No arguments exist to constrain."}
  query_sales: {setting: "on", values: ["off", "on"], about: "Constrain the quarter and the units/revenue/both metric enum."}
  render_chart: {setting: "off", values: ["off", "on"], about: "Nested series are locally validated; keep the first measured surface simple."}
  save_report: {setting: "off", values: ["off", "on"], about: "The program normally chooses this write and the registry validates it."}
  draft_report_email: {setting: "off", values: ["off", "on"], about: "External critique supplies the important factual boundary."}
  draft_clarifying_question: {setting: "off", values: ["off", "on"], about: "A plain bounded pending-record write."}
