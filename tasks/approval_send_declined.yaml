id: approval_send_declined
title: "The same request; the operator declines the send at the gate: nothing reaches the distributor"
use_case: messy_file

# Milestone 2, Part 2 task 4 (myron). The scripted operator answers no. The draft stays pending, and the thread
# holds no message from the agent: a declined send has no effect, and the run does not try again unasked.
input:
  thread: SYN-thread-1402
  from: SYN-contact-cedar
  distributor: SYN-DIST-003
  contact_email: contact@cedar.example
  period: 2026Q3
  text: "SYNTHETIC. Our Q3 numbers are attached; please send us the report when it is ready."
  file:
    name: cedar_q3_export.csv
    content: |
      Artikel;Bezeichnung;Menge;Umsatz_EUR
      SYN-SKU-005;Gizmo;90;6.750,00
      SYN-SKU-006;Doohickey;41;4.920,00

operator:
  - "Handle the new request on the outside channel, and send the report email to the contact once it is drafted."

outside: []

approvals: [no]

check: checks/approval_send.py:check_declined
